videos:
- part: 1
  id: xLdFY9mGJxI
  title: Introduction to the ODA Canvas
  duration: '14:53'
  published: '2026-10-27'
  summary: The ODA Canvas is the execution platform for TM Forum Open Digital Architecture (ODA) Components,
    with an open-source reference implementation. This first video in the ODA Canvas training series explains
    why the Canvas exists, from TM Forum's frameworks and Open APIs to the ODA Component and Canvas standards.
  description:
  - 'It covers what an ODA Component is and the services the Canvas provides to components, the business
    benefits of the approach, and a tour of the Canvas and its Portal: a component is deployed and its
    APIs, identity and observability are configured automatically. It finishes with which Canvas capabilities
    are available today, which are experimental and which are planned.'
  related:
  - canvas/README
  - canvas/Canvas-design
  replaces:
  - B5lF94l-Dek
  - RD6XJUPc5hw
  - kIxNnKHtnzQ
  chapters:
  - time: 0:00
    seconds: 0
    title: Title card
    transcript: 'Welcome to the first video in a series about the Open Digital Architecture Canvas. The
      Canvas is the execution platform for ODA Components, with an open-source reference implementation.
      This video starts with a short history, from TM Forum''s frameworks to its Open APIs, sharing what
      led us to creating the ODA Component and Canvas standards. It then shares what an ODA Component
      is, and what services the Canvas provides towards components.


      Next we''ll go through the business benefits of this approach, and a tour of the Canvas and its
      Portal. You''ll see a component deployed, with its APIs, identity and observability configured automatically.
      The video also covers which capabilities are available today, which are experimental, and which
      are planned. Let''s get started.'
  - time: 0:58
    seconds: 58
    title: Who this is for
    transcript: This video is for two groups. The first group is the architects and software engineers
      who build functional software components. They want to know what it means to meet the ODA standards
      and run on the Canvas. The second group is site reliability engineers who build or operate a Canvas
      platform. That might be a communication service provider running its own Canvas. Or it might be
      a cloud provider offering a managed Canvas to others.
  - time: '1:26'
    seconds: 86
    title: Roadmap
    transcript: We'll start with a short history of how we got here. Then we'll explain what an ODA Component
      is and what the Canvas provides. After that we'll cover the business benefits. Next comes a quick
      tour of the Canvas, including the Canvas Portal. We'll finish with where the work is heading. Later
      videos in the series go deeper into each area.
  - time: '1:50'
    seconds: 110
    title: Frameworks and the problem of interpretation
    transcript: For more than twenty-five years, TM Forum has been a hub for collaboration on telecom
      IT. The early frameworks gave the industry a common language for processes, information and functions.
      Operators used them successfully to design high-level architectures. They also gave a common language
      for product selection and requests for proposal. But they were not detailed enough for systems to
      work together seamlessly. So every integration needed custom work. That integration tax was paid
      again and again.
  - time: '2:25'
    seconds: 145
    title: The Open API programme
    transcript: The next big step was TM Forum's Open API programme. It began with experiments and hackathons
      around 2013. It was formally launched in 2015. Open APIs are detailed, prescriptive, machine-readable
      specifications for standard services. Adoption has been huge. By September 2026, there had been
      almost one point four million downloads. They came from nearly seventy-two thousand developers.
      Today, TM Forum Open APIs are the foundation for many telcos' IT services. They have enabled seamless
      integration between systems.
  - time: '3:05'
    seconds: 185
    title: The remaining gap
    transcript: Standard APIs didn't solve everything. Telecom IT estates are still diverse and complex,
      and upgrading them is hard. Often several systems have to be upgraded together in one large transformation
      project. Standardising the interfaces wasn't enough. The industry also needed a standard way to
      package, deploy and operate the software behind them.
  - time: '3:30'
    seconds: 210
    title: What is an ODA Component?
    transcript: That's where ODA Components come in. An ODA Component is an independently deployable unit
      of functionality. Alongside its business function, it declares its non-functional needs. These include
      the APIs it exposes and depends on, the events it publishes, its security roles and its observability.
      Components are interoperable, designed around end-to-end use cases. They are also portable and can
      run on any cloud platform that follows the standard.
  - time: '4:02'
    seconds: 242
    title: What is the ODA Canvas?
    transcript: The ODA Canvas is the cloud-native execution environment for those components. It reads
      each component's declared requirements. It provides the shared operational services components need,
      including API management, identity, observability and secrets. Component developers can focus on
      business functionality while the Canvas takes care of security, monitoring and scaling.
  - time: '4:32'
    seconds: 272
    title: Composable IT with ODA
    transcript: Put the two together and you get composable IT. Use cases are assembled from standard
      components. Components are deployed onto a Canvas. Canvas operators configure the underlying platform
      services, such as API gateways, service meshes, identity and observability. Those can be open-source
      reference modules or commercial cloud services. When a new business need appears, you assemble existing
      building blocks instead of starting a new integration project.
  - time: '5:05'
    seconds: 305
    title: Composable AI with Agentic ODA
    transcript: The same model now extends to AI. In the AI-Native Canvas, AI agents can be packaged as
      agentic components that follow the same component standard. Standard components can expose their
      APIs as tools for agents using the Model Context Protocol. Agents can describe themselves to other
      agents through agent-to-agent standards. The Canvas adds AI and data services, such as an AI gateway
      in front of the approved language models. This means agents from many vendors can be governed, observed
      and cost-managed in one consistent way.
  - time: '5:44'
    seconds: 344
    title: 'Example: identity is declared, not implemented'
    transcript: Identity is a good example of why this matters. Traditionally, each application ships
      with its own identity management. Operations teams then have to integrate each one. In the ODA model,
      a component only declares the roles it supports. The Canvas configures those roles in one shared
      identity platform. That could be Keycloak, Microsoft Entra ID, or another identity management platform.
      The Canvas does not mandate a specific product. It provides standard integration patterns, built
      on open standards, for interoperability and portability. Identities are managed once, consistently,
      across every application.
  - time: '6:28'
    seconds: 388
    title: 'Example: secrets without bootstrap credentials'
    transcript: Secrets work the same way. A component declares that it needs a secrets store, and the
      Canvas sets up a private vault for it. In the reference implementation that's HashiCorp Vault, but
      any secrets management platform can be used. The component authenticates with its own Kubernetes
      workload identity. So it never needs a bootstrap password just to reach the vault.
  - time: '6:56'
    seconds: 416
    title: Six benefits
    transcript: Why do this? The benefits are shared by service providers, software vendors, integrators
      and cloud providers. Seamless integration supports zero-touch, zero-wait and zero-trouble customer
      experiences. Operations get simpler. Hundreds of teams running vertically integrated applications
      become one site reliability team running a Canvas. Agility drives innovation, including faster adoption
      of AI-native capabilities. Integration becomes automated instead of a manual project. Security is
      built in, with a zero-trust architecture and security as code. And modular contracts let every component
      be upgraded continuously, reducing technical debt.
  - time: '7:38'
    seconds: 458
    title: An order-of-magnitude goal
    transcript: The ambition isn't an incremental gain. The goal is a step change, aiming for an order-of-magnitude
      improvement in efficiency and agility. And a faster transformation to an AI-native telco.
  - time: '7:53'
    seconds: 473
    title: The component standard in two layers
    transcript: The component standard has two layers. The lower layer is a set of design patterns for
      self-describing, modular software. Security and management are defined as code. The upper layer
      is a set of standard golden components. They represent industry best practice for breaking telecom
      IT into building blocks. You can browse them in the TM Forum ODA Component Directory.
  - time: '8:20'
    seconds: 500
    title: 'Live demo: the ODA Component Directory'
    transcript: The standard components are published in the ODA Component Directory on the TM Forum website.
      Its components map groups them by business domain, alongside the Canvas operators. Opening Product
      Catalog Management shows its specification. The version and status, its YAML definition, conformance
      profile, test kit and reference implementation. The Open APIs it must expose and those it may depend
      on. And the products certified against it. Every standard component, such as Product Inventory,
      follows the same structure.
  - time: '8:58'
    seconds: 538
    title: The component YAML
    transcript: Each component carries a YAML definition. Think of it as a Swagger file for a whole component.
      It describes the component's metadata and functional scope. Then, in its core, management and security
      functions, it lists the APIs it exposes and depends on. Also the events it uses, and the roles it
      needs. The specification reached version one, its generally available release, at the end of 2024.
  - time: '9:28'
    seconds: 568
    title: The Canvas as a set of operators
    transcript: The Canvas itself is modular. It is a set of software operators, following the Kubernetes
      operator pattern. The component management operator takes the component definition and breaks it
      into sub-resources. These include exposed APIs, dependent APIs, identity configuration and secrets
      management. Each sub-resource is handled by its own specialised operator. Each operator is a piece
      of software that holds the operational knowledge a human operator would otherwise apply by hand.
  - time: '10:04'
    seconds: 604
    title: 'Worked example: API exposure'
    transcript: API exposure shows the pattern. The component declares which APIs it wants to expose.
      And optionally, policies such as rate limiting, API-key checks, cross-origin rules or request validation.
      An API operator reads that declaration and automatically configures whichever gateway or service
      mesh the Canvas uses. The reference implementation has six options. They are the Istio service mesh
      and the Kong and Apache APISIX gateways. There are also operators for Azure API Management, Google
      Apigee and Whale Cloud. Any other gateway can be added with its own operator. The component stays
      the same, and only the operator changes.
  - time: '10:56'
    seconds: 656
    title: 'Live demo: the component inventory'
    transcript: All of this is visible in the Canvas Portal. Here is the component inventory. It lists
      standard components grouped by business domain and shows which ones are installed on this Canvas.
  - time: '11:13'
    seconds: 673
    title: 'Live demo: deploying a component'
    transcript: Components are packaged as Helm charts. Deploying one is just a matter of choosing the
      chart and giving the release a name. From there, the operators take over. They expose its APIs,
      register its roles and configure its monitoring. Later videos follow that process end to end.
  - time: '11:35'
    seconds: 695
    title: Identity configuration
    transcript: Identity follows the same pattern. A component declares its roles, either statically in
      its YAML or dynamically through a standard roles-and-permissions API. An identity config operator
      registers them in Keycloak, Microsoft Entra ID, or another identity management platform. Companion
      operators then create the component's client credentials and connect its API dependencies once access
      has been granted.
  - time: '12:04'
    seconds: 724
    title: Observability
    transcript: For observability, components publish metrics using OpenMetrics and traces using OpenTelemetry,
      rather than shipping their own monitoring tools. When the API operator exposes a component's metrics
      endpoint, it also sets up scraping. In the reference implementation that means Prometheus, Grafana,
      Jaeger and an OpenTelemetry collector. The same declaration can target managed Prometheus services,
      Datadog, or another observability platform instead. Metrics can be business metrics as well as technical
      ones, for example a new product being added to a catalog.
  - time: '12:44'
    seconds: 764
    title: Available today, experimental, planned
    transcript: Here's where things stand. Available in the reference implementation today are operators
      for component management, API management, identity, credentials, dependencies, secrets and disruption
      budgets. An OAuth2 configuration operator for authentication between components is available as
      a prototype. Experimental operators cover model-as-a-service, data products and carbon-aware scaling.
      Event management, cost control and database services are planned. The Canvas is generally available,
      with regular releases. Every change is checked by an automated behaviour-driven test suite, running
      against a real Kubernetes cluster.
  - time: '13:28'
    seconds: 808
    title: Measuring Canvas adoption
    transcript: How do you measure adoption? The outcome that matters is automated component deployment
      and lifecycle management. A service provider can turn on each light in turn as it automates API
      exposure, observability, identity, secrets. And, increasingly, responsible AI, cost and carbon management.
      The Canvas itself is modular and can be deployed incrementally.
  - time: '13:54'
    seconds: 834
    title: Built together
    transcript: The ODA Components and Canvas are the result of collaboration between software vendors,
      systems integrators, communication service providers and cloud providers. Together they deliver
      what the ODA Manifesto set out. A standard execution environment for ODA Components. That shared
      foundation lets the industry adopt new capabilities, including AI, faster together than any one
      company could do alone.
  - time: '14:22'
    seconds: 862
    title: What's next
    transcript: This video was an overview. The next videos in the series go deeper into how to buy or
      build a Canvas. They also cover authentication and authorization, and the AI-Native Canvas. After
      that come observability, and carbon-aware software. The reference implementation, its documentation
      and its use-case library are all on GitHub at tmforum-oda slash oda-canvas. And contributions are
      welcome.
- part: 2
  id: fMXEmWalRFc
  title: How do I buy or build an ODA Canvas?
  duration: '9:30'
  published: '2026-10-19'
  summary: 'There is no separate standard for the ODA Canvas itself. The standard is the ODA Component
    specification: a Canvas is any platform that reads a component''s specification and meets its requirements.
    This second video in the ODA Canvas training series explains the three ways to get one: public cloud
    offerings, rolling your own from the open-source reference implementation, or assembling vendor and
    open-source operators, and mixing and matching all three.'
  description:
  - It shows how to check that a Canvas really provides the services it should, by running a BDD feature
    from the Canvas test kit live in the Canvas Portal. It then explains how operators make the Canvas
    modular, walks through the operator catalogue, and shows the operators in a real Canvas and how they
    were chosen. Examples cover API management, observability, identity, secrets and carbon-aware scaling,
    followed by how to build your own operator and what's coming next.
  related:
  - canvas/source/operators/README
  - canvas/installation/README
  replaces:
  - dYyyCDPlVHY
  chapters:
  - time: 0:00
    seconds: 0
    title: How do I buy or build an ODA Canvas? (presenter introduction)
    transcript: 'Welcome to the second video in a series about the Open Digital Architecture Canvas. One
      question we''re asked a lot is how do I buy or build an ODA Canvas?


      With a traditional application, you buy the software and its platform together. Every vendor brings
      its own gateway, identity management and monitoring solutions. The ODA Canvas separates those. Components
      declare what they need, and the Canvas provides it, using the platform services you choose.


      So the Canvas isn''t one product. It''s a modular platform, built from Canvas operators. In this
      video we''ll look at the three ways to get a Canvas. We''ll see how to check that a Canvas is really
      providing the services it''s meant to. Then we''ll look at the types of operator, with examples,
      and at the ODA Canvas running on a real cluster. Finally, we''ll see what''s coming next.'
  - time: '1:00'
    seconds: 60
    title: The standard is the component
    transcript: There is no separate standard for the Canvas itself. The standard is the ODA Component
      specification. A Canvas is any platform that reads a component's specification and meets its requirements.
      It exposes the component's APIs, registers its roles, and monitors it. A component can also declare
      the AI models it needs, through the Model-as-a-Service operator. It can ask for data products through
      the Data operator. It can even manage its cost and carbon footprint, through the cost and carbon
      operators. This list isn't exhaustive. Any common platform service can be offered through the same
      pattern. The reference implementation does this on Kubernetes.
  - time: '1:45'
    seconds: 105
    title: Three ways to get a Canvas
    transcript: 'There are three ways to get a Canvas. First, a managed Canvas from a public cloud provider.
      At DTW Copenhagen, AWS, Microsoft Azure, China Mobile, Google Cloud and Oracle Cloud showed proofs
      of concept. They build on the reference implementation and the provider''s own services.


      Second, roll your own. The reference implementation is open source, under the Apache two dot O licence,
      and designed to be extended.


      Third, use operators from software vendors and open-source projects, such as Istio and Kong.'
  - time: '2:24'
    seconds: 144
    title: Mix and match
    transcript: These aren't either-or choices. The Canvas is modular, so you can mix and match. You might
      take a cloud provider's API management, the reference identity operator, and your own operator for
      an in-house system. A typical production Canvas combines standard operators with custom ones that
      apply the organisation's own policies.
  - time: '2:49'
    seconds: 169
    title: How you know it's a Canvas
    transcript: Whichever route you take, there's an objective way to check the result. The behaviour
      every Canvas must show is written down in two places. The use-case library describes it at a high
      level. Behaviour-driven development features describe it in detail, as scenarios. The test kit turns
      those scenarios into executable tests that can validate any Canvas implementation.
  - time: '3:16'
    seconds: 196
    title: Live, the test kit in the Canvas Portal
    transcript: Here is the test kit in the Canvas Portal. The catalogue loads the feature files straight
      from the GitHub repository. Each one is named after the use case it tests, such as installing components,
      exposing APIs, or configuring roles. You can pick features and run them against this Canvas. Every
      change to the reference implementation is checked this way too.
  - time: '3:44'
    seconds: 224
    title: Operators are the modules
    transcript: The modules of a Canvas are called Canvas operators. They follow the Kubernetes operator
      pattern, software that holds the operational knowledge for one job. The Component Management operator
      splits each component into parts, such as exposed APIs, dependent APIs and identity. A separate
      operator handles each part. So you can swap one technology for another without changing the component.
  - time: '4:13'
    seconds: 253
    title: The operator catalogue
    transcript: These are the operator types today. Seven are available now. They cover components, APIs,
      identity, credentials, dependencies, secrets and disruption budgets. A prototype operator handles
      authentication between components. Three operators are experimental. One provides model as a service.
      One manages data products. And one scales workloads to cut carbon. Event management, cost control
      and database services are planned. The list isn't fixed. New types will be added as the Canvas matures.
  - time: '4:49'
    seconds: 289
    title: Live, the operators in this Canvas
    transcript: Here are the operators in a running Canvas, in the Canvas Portal. Each one shows its catalogue
      number, its image and its pods. This Canvas uses the Kong API operator, the Keycloak identity operator,
      and the Vault secrets operator. The same list is visible from the command line, as ordinary Kubernetes
      deployments.
  - time: '5:13'
    seconds: 313
    title: Live, choosing the modules
    transcript: Choosing the modules is configuration, not code. When this Canvas was installed, the Istio
      API operator was switched off and Kong switched on. Only one API operator runs at a time. Later,
      the simple dependency operator was replaced with one that waits for an access grant in Keycloak.
      The components didn't change at all.
  - time: '5:38'
    seconds: 338
    title: Example 1, API management
    transcript: First, API management. Every component declares the APIs it exposes, with policies such
      as rate limits or API-key checks. A Canvas can use any API gateway or service mesh, and an API operator
      configures it. There are operators for Istio, Kong and Apache APISIX. There are also operators for
      Azure API Management, Google Apigee and Whale Cloud. Any other gateway can be added with its own
      operator.
  - time: '6:10'
    seconds: 370
    title: Example 2, observability
    transcript: Second, observability. A component doesn't bring its own monitoring tools. It publishes
      metrics and traces using the OpenMetrics and OpenTelemetry standards. When the API operator exposes
      the metrics endpoint, it also sets up how it is collected. That could be a Prometheus operator,
      a managed Prometheus service, or Datadog. The reference implementation includes a ready-made stack,
      and any other observability platform can be used.
  - time: '6:43'
    seconds: 403
    title: Example 3, identity
    transcript: Third, identity. Most applications today bring their own identity management. Each one
      has to be integrated with the company's central system. In the ODA model, a component holds only
      its roles and permissions, and declares them. Identity config operators register them in Keycloak,
      Microsoft Entra ID, or another identity platform. Companion operators manage each component's credentials
      and connect its dependencies once access is granted.
  - time: '7:16'
    seconds: 436
    title: Example 4, secrets
    transcript: Fourth, secrets. A component declares that it needs a secrets store, and the secrets management
      operator provides one. The reference implementation uses HashiCorp Vault, and another secrets platform
      can be used. The component signs in with its own Kubernetes identity, so no bootstrap passwords
      are needed.
  - time: '7:37'
    seconds: 457
    title: Example 5, carbon-aware scaling
    transcript: Carbon management was only a plan in the original version of this video. Now there is
      an experimental operator. A component marks some workloads as carbon-aware. The operator reads real-time
      grid carbon intensity, and limits how far those workloads scale when electricity is carbon-intensive.
      There's a dedicated video on this.
  - time: '8:01'
    seconds: 481
    title: Build your own operator
    transcript: You can also build your own operators. They can be written in any language that follows
      the Kubernetes operator pattern. The reference operators use Python with the KOPF framework, and
      Go. To work with the rest of the Canvas, an operator uses the same standard custom resources. The
      repository includes an AI coding-assistant skill for creating operators, and the test kit to check
      them.
  - time: '8:27'
    seconds: 507
    title: What's next
    transcript: The biggest area of new work is the AI-Native Canvas. Components will declare which AI
      models they need. The experimental Model-as-a-Service operator grants governed access through a
      model gateway. The gateway applies guardrails and records usage. The AI-Native Canvas has its own
      video. Operators for events, cost control and database services are also on the roadmap.
  - time: '8:55'
    seconds: 535
    title: Recap
    transcript: To recap. You can buy a Canvas, build one, or mix and match. Operators are the modules,
      and you choose them through configuration. Whatever you choose, the test kit checks that it behaves
      like a Canvas.
  - time: '9:12'
    seconds: 552
    title: Find out more
    transcript: To find out more, see the Open Digital Architecture pages on the TM Forum website. Browse
      the ODA Component Directory. And explore the reference implementation on GitHub, at TM Forum dash
      ODA slash ODA Canvas.
- part: 3
  id: a6j6tUDTS80
  title: Authentication and Authorization in the ODA Canvas
  duration: '8:45'
  published: '2026-10-19'
  summary: An ODA Component doesn't implement identity management. It declares the roles it supports,
    and the ODA Canvas configures them in one shared identity platform, such as Keycloak, Microsoft Entra
    ID or another identity platform. This third video in the ODA Canvas training series explains how that
    works.
  description:
  - 'It covers how a component''s YAML declares its security needs, how every component gets its own client,
    the Canvas system role, and static and dynamic roles (through TMF672). It then runs a complete example
    on a real Canvas with three components: a product catalog, product order capture and product inventory.
    You''ll see their clients and roles appear in Keycloak, a role grant that also connects one component
    to another, a product order flowing through all three, and the automated cleanup.'
  related:
  - canvas/Authentication-design
  - canvas/SecurityPrinciples
  - canvas/source/operators/TMFOP003-Identity-Config/README
  - canvas/source/operators/TMFOP004-Credentials-Management/README
  - canvas/source/operators/TMFOP005-Dependency-Management/README
  - canvas/source/operators/TMFOP008-OAuth2-Config/README
  - canvas/usecase-library/UC005-Configure-Clients-and-Roles
  - canvas/usecase-library/UC009-Internal-Authentication
  - canvas/usecase-library/UC010-External-Authentication
  replaces:
  - w0iQv9FtuiM
  chapters:
  - time: 0:00
    seconds: 0
    title: Title (presenter introduction)
    transcript: 'Welcome to the third video in our series about the ODA Canvas. This one is about authentication
      and authorization. Traditionally, every application ships with its own identity management. Operations
      teams then have to integrate each one, and manage users and roles in many places. An ODA Component
      is different. It doesn''t implement any identity management at all. Instead, it declares the roles
      it supports. The Canvas configures these roles in one shared identity platform. That could be Keycloak,
      Microsoft Entra ID, or any other identity platform.


      In this video we''ll look at how that works. We''ll see how a component''s YAML declares its security
      needs, and how the Canvas sets up its clients and roles. Then we''ll run a complete example with
      three components. You''ll see a role grant, and also that it connects from one component to another.'
  - time: '1:00'
    seconds: 60
    title: Four questions
    transcript: It answers four questions. First, what is the job of the component, and what is the job
      of the Canvas? Second, how does the Canvas get permission to manage a component? Third, how does
      a component define the roles that others can be granted? And fourth, how does granting one of those
      roles connect one component to another?
  - time: '1:25'
    seconds: 85
    title: Components declare, the Canvas implements
    transcript: An ODA component does not bring its own identity management. Instead, its YAML specification
      declares what it needs, in the security function section. When the component is deployed, the component
      operator copies those requirements into an identity config resource. An identity config operator
      then configures the identity platform to match. The reference Canvas has operators for Keycloak
      and for Microsoft Entra ID. Another identity platform can be used, through the same standard pattern.
  - time: '2:01'
    seconds: 121
    title: Every component gets its own client
    transcript: The operator first creates a client for the component. This client is the component's
      own identity. When the component calls another component's API, it uses this client to get an access
      token. So every call between components carries the identity of the caller.
  - time: '2:23'
    seconds: 143
    title: The Canvas system role
    transcript: The Canvas has its own identity too, called the Canvas system client. Every component
      must name one of its roles as its Canvas system role. When the component is deployed, the operator
      grants that role to the Canvas system client. That's how the Canvas earns permission to call the
      component's management and security APIs.
  - time: '2:48'
    seconds: 168
    title: Static and dynamic roles
    transcript: A component can define its other roles in two ways. Static roles are listed directly in
      its YAML. Dynamic roles are published through a TM Forum Open API, the TMF672 roles and permissions
      API. The operator registers for events on that API. When the component adds a permission set, the
      matching role is added in the identity platform. When it removes one, the role is removed. A product
      catalog might add a role for each new partner catalog.
  - time: '3:23'
    seconds: 203
    title: A grant is also a connection
    transcript: Roles are how access is granted. Other systems, or other components, are given roles on
      a component's client. The reference Canvas can go one step further. Its dependency management operator
      watches for role grants. Suppose a component is granted a role on another component. The operator
      then connects its dependent API to the matching exposed API. So a component can only discover an
      API it has been allowed to call.
  - time: '3:56'
    seconds: 236
    title: The scenario
    transcript: Here's the scenario. A product catalog holds two catalogs. One is a communication service
      provider's retail catalog, and one is a wholesale catalog for MVNOs. A product order capture and
      validation component depends on the catalog, to check what is ordered. It also depends on a product
      inventory, where the ordered products are created.
  - time: '4:19'
    seconds: 259
    title: Deploy the product catalog
    transcript: We start by deploying the product catalog component. In the Canvas Portal we follow it
      until it is complete. Its security function names a Canvas system role, and exposes the TMF672 roles
      and permissions API for its other roles.
  - time: '4:39'
    seconds: 279
    title: Its client appears in Keycloak
    transcript: In Keycloak, the identity config operator has created a client for the new component.
      It holds the Canvas system role that the component declared. This is the role the Canvas uses to
      manage the component. Nobody configured any of this by hand.
  - time: '4:59'
    seconds: 299
    title: Static roles
    transcript: Before we go further, here is what static roles look like. This example from the Canvas
      test kit lists three roles in its YAML. There's an administrator and two catalog owners. When a
      component like this is deployed, the operator adds all three to its client. Our three components
      use dynamic roles instead.
  - time: '5:23'
    seconds: 323
    title: Dynamic roles through TMF672
    transcript: Now we load the catalog's test data. Along with the products, it creates two permission
      specification sets through the TMF672 API. One is for the CSP, and one is for MVNOs. The component
      publishes an event for each. The operator receives them, and the two new roles appear on the component's
      client in Keycloak.
  - time: '5:48'
    seconds: 348
    title: Deploy the order and inventory components
    transcript: Next we deploy the product inventory and the product order components. Both get their
      own clients in Keycloak. The order component declares two dependencies, on the product catalog API
      and the product inventory API. The Canvas Portal shows both dependencies as unmet. The APIs exist,
      but the order component hasn't been granted access to either of them.
  - time: '6:16'
    seconds: 376
    title: Grant a catalog role, and the dependency is met
    transcript: Now we act as the identity administrator. We open the order component's service account
      in Keycloak and assign it the CSP role on the product catalog. Within a few seconds, the Canvas
      Portal shows the catalog dependency as met, with the catalog's address filled in. One grant gave
      permission and made the connection.
  - time: '6:41'
    seconds: 401
    title: The same for the inventory
    transcript: We do the same for the product inventory, granting the order component the CSP role on
      the inventory's client. The second dependency is now met too. The order component is ready to do
      its job.
  - time: '6:57'
    seconds: 417
    title: Send a product order
    transcript: Now we send a valid product order to the order component. It's a retail customer of the
      CSP, ordering an unlimited SIM-only plan. The order is accepted and acknowledged.
  - time: '7:14'
    seconds: 434
    title: What happened behind the scenes
    transcript: Behind the scenes, the order component looked up each ordered offering in the product
      catalog. It used the address it was given when access was granted. The offering was found, so the
      order was valid. Then it created the product in the product inventory. The customer's new product
      is now in the inventory, ready to use.
  - time: '7:37'
    seconds: 457
    title: Automated cleanup
    transcript: Finally, the cleanup. As each component is uninstalled, the operator deletes its client
      from Keycloak, along with every role the component defined. The grants to the Canvas system client
      and to other components go with them. No orphaned identities or permissions are left behind.
  - time: '7:59'
    seconds: 479
    title: Answers to the four questions
    transcript: So, the answers. Components declare their security needs, and the Canvas configures a
      shared identity platform. Each component gets a client, its own identity for outbound calls. The
      Canvas gets access through the Canvas system role. Components define other roles statically, or
      dynamically through TMF672. And granting a role can also resolve a dependency.
  - time: '8:26'
    seconds: 506
    title: Find out more
    transcript: The authentication design, the use cases and the operator documentation are all in the
      oda-canvas repository on GitHub. The example components and their test data are in the reference
      example components repository. If you'd like to contribute, please get involved.
- part: 4
  id: 0QtnMJDblvE
  title: The AI-Native ODA Canvas
  duration: '13:53'
  published: '2026-10-19'
  summary: 'AI agents are fast becoming the way service providers deliver intelligent, autonomous services,
    but wiring each agent directly to its favourite model provider brings lock-in, hidden costs and inconsistent
    guardrails at enterprise scale. This fourth video in the ODA Canvas training series explains the AI-Native
    ODA Canvas: agents packaged as ODA Components that declare the tools and models they need, with governed
    access granted by the Canvas.'
  description:
  - 'It covers what TM Forum''s 2026 Catalysts show, MCP as one more exposed API type, descriptions written
    for agents, agentic components and dependent AI models, and Model as a Service (TM Forum GB1085) with
    the model gateway. It looks at the Canvas services needed to run AI at scale, the Canvas as a self-describing
    registry, and evaluation. It finishes with how AI is helping build the Canvas itself: why a modular
    architecture like ODA matters for AI-assisted development, AGENTS.md files, and agent skills as an
    open standard for capturing knowledge as a reusable asset.'
  related:
  - canvas/AI-Native-Canvas-design
  - canvas/source/operators/TMFOP009-Model-as-a-Service/README
  - canvas/usecase-library/UC016-ODA-Component-and-API-Registry
  replaces:
  - MICzwN8VB_o
  chapters:
  - time: 0:00
    seconds: 0
    title: The AI-Native ODA Canvas (presenter introduction)
    transcript: 'Welcome to the fourth video in our series. This one is about the AI-Native ODA Canvas.
      AI agents are quickly becoming the way service providers deliver intelligent, autonomous services.


      Most organisations started with a few pilots. Each team wired its agents directly to its favourite
      model provider. That works for a demo. At enterprise scale it brings lock-in, hidden costs and inconsistent
      guardrails. The AI-Native Canvas takes a different approach. Agents are packaged as ODA Components.
      They declare the tools and models they need, and the Canvas grants governed access.


      In this video, we look at how systems of record components can make their APIs available as tools
      for agents. We show how to package and deploy agents as modular components. We show how those agents
      access the underlying AI services, using model as a service and the model gateway. We look at the
      services needed to run AI at scale. And we finish with how AI is helping us build the Canvas itself.'
  - time: '1:18'
    seconds: 78
    title: Four questions
    transcript: The AI-Native Canvas work started from three questions. How do we expose ODA Components
      as tools for AI agents? How do we deploy the agents themselves as components? And how do we operate
      many agents, from many vendors, with proper governance? This video adds a fourth question. How can
      AI help us build the Canvas?
  - time: '1:45'
    seconds: 105
    title: What the 2026 Catalysts show
    transcript: TM Forum's Catalyst projects show where the industry is heading. At DTW twenty twenty-six,
      there were fifty-nine Catalysts. Nine in ten used AI. About half were built from AI agents, often
      several agents working together. More than half targeted autonomous networks. About one in five
      tackled trust, security and governance for agents. And several built the platform that agents need,
      such as registries, runtimes and a model gateway. Much of the work in the AI-Native Canvas is lessons
      learned from these Catalyst projects.
  - time: '2:23'
    seconds: 143
    title: MCP is one more exposed API
    transcript: Components already declare the APIs they expose. That includes cross-industry APIs such
      as OpenMetrics. So adding MCP was simple. MCP became one more API type. The product catalog test
      component exposes an MCP server beside its Open APIs. MCP keeps long-lived connections open, unlike
      short REST calls. Because the component declares the type, the API operator configures the gateway
      for it automatically.
  - time: '2:58'
    seconds: 178
    title: Descriptions are written for agents
    transcript: The heart of an MCP server is its plain-language description of each tool and argument.
      Swagger files were written for API experts. Agents need more. In testing, detailed explanations
      and concrete examples made the difference. One agent only used the filter argument correctly once
      an example was added. Version five of the TM Forum Open APIs includes JSON examples. They cover
      request and response payloads, embedded directly in the Open API specifications. That lets us generate
      MCP servers automatically.
  - time: '3:37'
    seconds: 217
    title: Agents as components
    transcript: The second question is about packaging agents as components. Four assumptions shape the
      design. Models run as services on the platform, and agents reach them through APIs. Service providers
      keep approved catalogues of models. Agents are non-deterministic, so they need continuous evaluation,
      not just fixed tests. And agents need extra services, such as vector databases and anonymisation,
      which the Canvas should provide.
  - time: '4:07'
    seconds: 247
    title: Dependent AI models
    transcript: With those assumptions, the component model extends naturally. A component already lists
      the APIs it depends on. Now it can list the AI models it depends on, in priority order. It describes
      its use case, and the guardrail thresholds it needs. The Canvas grants access to whichever models
      are on the approved list. This starts as an experimental resource of its own, called dependent AI
      model. Later it may join the main component specification.
  - time: '4:42'
    seconds: 282
    title: Training builds intelligence, inference builds cost
    transcript: TM Forum's Model as a Service guide starts with a simple observation. Training builds
      intelligence, but inference builds cost. Today, many teams wire their agents directly to model providers.
      That creates lock-in, hidden costs and inconsistent guardrails. Every team rebuilds the same plumbing.
      Model as a service puts a control plane between agents and models. It separates the demand for intelligence
      from its supply.
  - time: '5:16'
    seconds: 316
    title: Three options
    transcript: The guide weighed three options. Standardising on one hyperscaler's AI service was rejected.
      It just trades model lock-in for platform lock-in. Waiting for an industry-wide standard was judged
      premature, because the market moves too fast. Model as a service was selected. It gives a service
      provider its own standard layer today, without waiting for the market to settle.
  - time: '5:42'
    seconds: 342
    title: What the control plane provides
    transcript: The control plane offers a consistent set of services. One standard API reaches every
      model, internal or external. A catalogue helps developers pick the most efficient model that does
      the job. Routing fails over when a provider goes down. Golden datasets catch silent quality drift.
      Tracing follows every request end to end. Guardrails block prompt attacks and redact personal data.
      And cost tracking stops a runaway agent from blowing the budget.
  - time: '6:16'
    seconds: 376
    title: The model gateway in the Canvas
    transcript: On the Canvas, this is the job of the Model-as-a-Service operator. It's experimental today.
      The operator reads the models a component depends on. It configures the model gateway. Then it gives
      the component a credential and an endpoint. From then on, every model call goes through the gateway.
      Guardrails are enforced, and each call is recorded for audit, observability and cost.
  - time: '6:46'
    seconds: 406
    title: 'Simulated demo: Model Gateway in the Canvas Portal'
    transcript: This is how the Model Gateway will appear in the Canvas Portal. The list shows the AI
      models available through the gateway. They cover high, medium and fast reasoning, and multimodal
      models. Each comes from a primary or an open provider, with its own gateway endpoint. The Portal
      can test the connection. It gets a token, lists the models, and sends a prompt through the gateway.
  - time: '7:16'
    seconds: 436
    title: Six levers of inference cost
    transcript: The guide also explains what drives the cost of each answer. It names six levers. The
      first three are capability, accuracy and latency. The next three are throughput, context window
      and token efficiency. A cheaper model is a false economy if it fails the task. But the most capable
      model is often more than a task needs. The aim is sufficient intelligence at the optimal cost.
  - time: '7:47'
    seconds: 467
    title: Canvas services for AI
    transcript: To run agents from many vendors, the Canvas needs a broader set of services. It needs
      access to language, embedding and multimodal models. It needs classical machine learning, with proper
      MLOps. It needs supporting services, such as vector databases. Observability must cover model calls,
      with LangSmith, OpenLLMetry or another platform. And it needs the model gateway, an evaluation framework,
      and a registry of agents, tools and use cases.
  - time: '8:20'
    seconds: 500
    title: The Canvas with AI and data
    transcript: Here is how it fits together. Agentic components sit beside the standard components. Systems
      of record expose MCP, so agents can use them as tools. Agents publish agent cards, using agent-to-agent
      standards, so other agents can discover them. Agentic components are shown in white on purpose.
      Like engagement systems, agents can differentiate a service provider. They don't have to be standard,
      but they still follow the component model. The model and data operators, both experimental, extend
      the Canvas to models and data products.
  - time: '8:59'
    seconds: 539
    title: The Canvas describes itself
    transcript: Because everything on the Canvas is declared, the Canvas can describe itself. The reference
      implementation includes a resource inventory, based on the TMF six three nine Open API. It registers
      every component, API and agent. Like any TM Forum API, it is also offered as an MCP server. An operations
      agent, if requested and given the permissions, can ask what is deployed. It can also draw a component
      and its APIs. The MCP server also has Helm tools, so an agent can propose installing a component.
  - time: '9:39'
    seconds: 579
    title: Evaluation
    transcript: Because agents are non-deterministic, they should ship with evaluation data. Before deployment,
      a golden set of questions sets a baseline. The TM Forum AI assistant used eighty-seven questions.
      In production, real questions and answers are logged and scored. People and AI evaluators rate them
      for relevance, accuracy and completeness. So a change, such as a new model, is checked against the
      baseline before it goes live.
  - time: '10:12'
    seconds: 612
    title: AI is an amplifier
    transcript: The AI tools we use to build the Canvas follow the same rule. Google's DORA report studied
      AI-assisted software development. It found that AI is an amplifier. It magnifies the strengths of
      high-performing teams. It also magnifies the dysfunctions of struggling ones. With a modular, loosely
      coupled, API-first architecture, AI amplifies that. With a tightly coupled monolith, AI amplifies
      the chaos.
  - time: '10:45'
    seconds: 645
    title: Why ODA suits AI development
    transcript: The Open Digital Architecture is a good fit for AI development. Modular components give
      an agent small, well bounded tasks. Open APIs and shared data models give it clear contracts to
      code against. The component specification is declarative, so the result can be checked. And the
      use cases and BDD tests let an agent verify its own work.
  - time: '11:09'
    seconds: 669
    title: 'Live: AGENTS.md in the oda-canvas repository'
    transcript: The Canvas repository documents itself for AI agents. There's an AGENTS dot M D file at
      the root, and in each main area of the repository. AGENTS dot M D is an open format that most coding
      agents read. It tells an agent what the project is, how it's structured, and the do's and don'ts.
      The operators folder, for example, explains the operator pattern and its code conventions.
  - time: '11:38'
    seconds: 698
    title: 'Agent skills: knowledge as a reusable asset'
    transcript: Agent skills go a step further. A skill is a folder with a SKILL dot M D file, plus any
      scripts and references it needs. Its description tells the agent when to load it. Agent Skills is
      an open standard. The same skill works with Claude Code, GitHub Copilot and Codex. It works with
      Google Antigravity, Cursor or another agent too. That turns expert knowledge into a reusable asset.
      It's written once, and every contributor's agent can use it.
  - time: '12:15'
    seconds: 735
    title: 'Live: the create-oda-operator skill'
    transcript: The Canvas repository already has a set of skills. They cover operating the Canvas, writing
      use cases and BDD features, Helm charts and CI. The create-oda-operator skill helps anyone build
      a new Canvas operator with AI. It gives the agent the framework, the pinned versions, and a map
      of existing operators to copy from. A contributor's agent starts with the knowledge of the core
      team.
  - time: '12:46'
    seconds: 766
    title: What's available today
    transcript: Here's where things stand. MCP as an exposed API type, and the resource inventory MCP
      server, are available today. The Model-as-a-Service operator, the model gateway and the data product
      operator are experimental. At present we are maintaining the dependent AI model as an independent
      resource. It may join the component specification later. A model manager for classical machine learning
      is still a proposal. And the AGENTS dot M D files and agent skills are ready to use now.
  - time: '13:21'
    seconds: 801
    title: Find out more
    transcript: To find out more, read the AI-Native Canvas design in the oda-canvas repository. Then
      read TM Forum's Model as a Service guide. The work happens in the open, in the TM Forum Innovation
      Hub. If you'd like to contribute, point your coding agent at the repository. Its AGENTS dot M D
      files and skills will help it get started. The repository is on GitHub, at TM Forum dash ODA slash
      ODA Canvas.
- part: 5
  id: 3Mcv0oc-0rs
  title: Observability in the ODA Canvas
  duration: '9:44'
  published: '2026-10-24'
  summary: 'Traditionally, every application arrives with its own monitoring agents and dashboards, and
    operations teams spend weeks wiring each one into their tools. An ODA Component is different: it declares
    its metrics API in its specification, and the ODA Canvas configures the observability platform for
    it automatically, using open standards (OpenMetrics for metrics, OpenTelemetry for traces), so any
    compliant platform can be used. This fifth video in the ODA Canvas training series explains how.'
  description:
  - 'It covers the three kinds of observability (technical metrics, business metrics and traces), how
    the Canvas wires a component''s metrics API to the platform with a ServiceMonitor, and the choices
    for managed services. It then explores the reference observability stack live: business and technical
    metrics in Prometheus, a component dashboard in Grafana, and traces in Jaeger, sent through the OpenTelemetry
    Collector. It finishes with the Canvas Portal and the BDD features that test it all.'
  related:
  - canvas/Observability-design
  - canvas/charts/observability-stack/README
  - canvas/usecase-library/UC006-Configure-Observability
  - canvas/usecase-library/UC011-View-Technical-Observability
  - canvas/usecase-library/UC012-View-Business-Observability
  - docs/Observability-Tutorial/README
  replaces: []
  chapters:
  - time: 0:00
    seconds: 0
    title: Observability in the ODA Canvas (presenter introduction)
    transcript: Welcome to the fifth video in the ODA Canvas training series, on observability. Traditionally,
      every application arrives with its own monitoring agents and its own dashboards. Operations teams
      then spend weeks wiring each into their own tools. An ODA Component is different. It declares its
      metrics APIs in its specification. The Canvas reads that declaration and configures the observability
      platform for it automatically. It uses open standards, OpenMetrics for metrics and OpenTelemetry
      for traces. So any compliant platform can be used. In this video, we look at the three kinds of
      observability the Canvas supports. We see how a component's metrics are wired up when it is deployed.
      Then we explore the reference stack live, with Prometheus, Grafana and Jaeger.
  - time: 0:56
    seconds: 56
    title: One view across many components
    transcript: A service provider may run dozens of components from many different vendors. The operations
      team needs one consistent view across all of them. They should not need a different tool for each
      vendor. The Canvas provides that view, by connecting every component to the same observability platform.
      It can even trace a single request across components, and into the Canvas services they use.
  - time: '1:24'
    seconds: 84
    title: Three kinds of observability
    transcript: The Canvas supports three kinds of observability. Technical metrics show how a component
      is running, such as its CPU, memory and request rates. Business metrics are specific to each component,
      for example the number of orders it has captured. Traces follow a single request step by step, even
      across components and the Canvas services they use. Together, they show whether a component is healthy,
      and give insights into its business performance metrics. They also help troubleshoot issues, for
      example to track where time is spent for a request.
  - time: '2:03'
    seconds: 123
    title: Built on open standards
    transcript: The Canvas builds on two open standards. OpenMetrics defines how a component exposes its
      metrics for a platform to collect. OpenTelemetry defines how a component sends traces and other
      telemetry. The reference implementation uses Prometheus, Grafana and Jaeger. But the Canvas mandates
      no product. A managed cloud service, or another observability platform, can be used instead.
  - time: '2:30'
    seconds: 150
    title: The reference observability stack
    transcript: The Canvas repository includes a Helm chart for a complete reference stack. It installs
      into its own monitoring namespace. Prometheus collects and stores metrics, and Grafana turns them
      into dashboards. Jaeger stores and displays traces. The OpenTelemetry Collector receives telemetry
      from components and forwards traces to Jaeger.
  - time: '2:56'
    seconds: 176
    title: A component declares its metrics API
    transcript: Metrics start with the component specification. In the management function, the component
      lists a metrics API alongside its other exposed APIs. Its API type is openmetrics, the open standard
      for metrics. It also gives the path and port where its metrics can be read. The component does not
      say which observability platform will read them. That is the Canvas's job.
  - time: '3:24'
    seconds: 204
    title: How the Canvas wires it up
    transcript: When the component is deployed, the component operator creates an ExposedAPI resource
      for each API. The API operator handles each one. For an API of type openmetrics, it also configures
      the observability platform. In the reference Canvas, it creates a ServiceMonitor resource. Prometheus
      finds the ServiceMonitor and starts scraping the metrics endpoint every fifteen seconds. When the
      component is removed, the ServiceMonitor is removed with it.
  - time: '4:01'
    seconds: 241
    title: Choose how metrics are collected
    transcript: Not every platform uses ServiceMonitors. So the API operator has a setting called open
      metrics implementation. ServiceMonitor is the default, for platforms that use the Prometheus operator.
      Prometheus annotation adds pod annotations instead, which some managed Prometheus services read.
      Datadog annotation uses Datadog's own annotation format. The component specification stays the same
      in every case.
  - time: '4:31'
    seconds: 271
    title: 'Live: the Canvas created the ServiceMonitor'
    transcript: Here is a product catalog component, deployed as release obs. It has three exposed APIs,
      and one of them is the metrics API. The Canvas has created a ServiceMonitor for it automatically.
      It points at the component's metrics path on port four thousand, every fifteen seconds. Nobody had
      to configure Prometheus by hand.
  - time: '4:57'
    seconds: 297
    title: 'Live: Prometheus finds the component'
    transcript: In Prometheus, the target health page lists everything it scrapes. The product catalog's
      metrics endpoint is here, and its state is up. Prometheus picked it up from the ServiceMonitor within
      seconds of the component being deployed.
  - time: '5:17'
    seconds: 317
    title: 'Live: business metrics in Prometheus'
    transcript: This component counts its business events. Every time a catalog, category, product specification
      or product offering is created or removed, a counter goes up. This query shows the rate of each
      kind of event over the last fifteen minutes. These are business metrics, defined by the component
      itself, and collected by the Canvas.
  - time: '5:44'
    seconds: 344
    title: Technical metrics come with the platform
    transcript: Technical metrics need nothing from the component at all. The platform already reports
      the CPU and memory of every container. Here is the CPU use of each pod in the product catalog component.
      The service mesh can add request rates and latencies in the same way.
  - time: '6:05'
    seconds: 365
    title: 'Live: a Grafana dashboard for the component'
    transcript: Grafana turns these metrics into dashboards, using Prometheus as its data source. This
      dashboard puts one component's business and technical metrics side by side. At the top are business
      events per minute, by type. Below are the CPU and memory of each of the component's pods. An operations
      team can build one dashboard like this and reuse it for every component.
  - time: '6:35'
    seconds: 395
    title: 'Live: the platform dashboards'
    transcript: The reference stack also comes with standard Kubernetes dashboards. Choosing the components
      namespace shows the CPU and memory of every deployed component together. So the same tool covers
      both the platform and the business view.
  - time: '6:54'
    seconds: 414
    title: How traces reach Jaeger
    transcript: Traces work the other way round. Instead of being scraped, the component pushes its traces
      as they happen. It sends them using the OpenTelemetry protocol to the OpenTelemetry Collector. The
      collector batches them and forwards them to Jaeger. Because the protocol is standard, the collector
      could forward them to another tracing platform instead.
  - time: '7:19'
    seconds: 439
    title: Pointing a component at the collector
    transcript: The collector address is set when the component is installed, in its Helm values. It is
      part of the environment, not of the component specification. Here, tracing is enabled and the component
      sends its traces to the collector in the monitoring namespace.
  - time: '7:37'
    seconds: 457
    title: 'Live: finding traces in Jaeger'
    transcript: In Jaeger, the product catalog appears as its own service. Searching it lists recent traces,
      one for each API request. The chart at the top shows how long each request took. So a slow or failing
      request stands out straight away.
  - time: '7:57'
    seconds: 477
    title: 'Live: inside one request'
    transcript: Opening a trace shows one request from end to end. It starts with the incoming HTTP call.
      Then come the middleware steps that validate the request against the TMF API definition. Last come
      the calls to the database. Each step shows exactly how long it took, so it is clear where the time
      goes.
  - time: '8:20'
    seconds: 500
    title: Observability in the Canvas Portal
    transcript: The Canvas Portal has an observability page that finds the telemetry tools in the cluster.
      It shows Prometheus, Grafana and Jaeger, each with its address inside the cluster. Langfuse, a tool
      for LLM observability, is shown in grey. The Canvas is still under development, and LLM observability
      is in the backlog.
  - time: '8:47'
    seconds: 527
    title: Tested with BDD features
    transcript: These behaviours are tested automatically. One BDD feature installs a component and checks
      that a ServiceMonitor is created, then removed on uninstall. Another adds catalog data and checks
      that new events reach the OpenTelemetry Collector. Both are tagged, so a Canvas without these tools
      simply skips them.
  - time: '9:08'
    seconds: 548
    title: Summary
    transcript: To recap. A component declares its metrics API in its specification, and sends its traces
      using OpenTelemetry. The Canvas configures the observability platform for it automatically, and
      removes the configuration when the component is uninstalled. The reference stack uses Prometheus,
      Grafana and Jaeger, but any platform that supports the open standards can be used. To find out more,
      see the observability design and the observability stack chart in the ODA Canvas repository.
- part: 7
  id: 6ONDbSo3RfY
  title: The ODA Agent Skills Marketplace
  duration: '11:27'
  published: '2026-11-11'
  summary: AI software engineering agents are only as good as the context they are given and the process
    they follow. TM Forum's Open Digital Architecture already holds that context in its Open APIs, ODA
    Component specifications and use cases. The ODA Agent Skills Marketplace packages it as an agent-friendly
    knowledge base, with Agent Skills that use it across the whole software delivery lifecycle, from requirements
    to operations.
  description:
  - This seventh video in the ODA Canvas training series explains why the ODA matters for software engineering
    agents, what an Agent Skill is, and how the knowledge was converted for agents. It tours the marketplace
    on GitHub, its consumer and creator plugins, and the reference example components (Helm charts, source
    code and architecture diagrams) that its skills have scaffolded. They provide the Open API interoperability,
    not the business functionality. The marketplace is an alpha, released to show the concept and gather
    feedback.
  related:
  - docs/AI-Assisted-Development
  - canvas/ai-coding-assistants
  - docs/ODAComponentTutorial/README
  replaces: []
  chapters:
  - time: 0:00
    seconds: 0
    title: The ODA Agent Skills Marketplace (presenter introduction)
    transcript: Welcome to the seventh video in the ODA training series, on the ODA Agent Skills Marketplace.
      AI software engineering agents are changing how software is built. But an agent is only as good
      as the context it is given, and the process it follows. TM Forum's Open Digital Architecture already
      holds that context, in its Open APIs, components, use cases and other frameworks. The marketplace
      packages it as an agent-friendly knowledge base. It adds Agent Skills that use it at every stage,
      from requirements through to operations. In this video, we look at why the ODA matters for software
      engineering agents, and what an Agent Skill is. Then we tour the marketplace on GitHub, and the
      reference components its skills have already scaffolded. This is an alpha version, released to show
      the concept and gather feedback.
  - time: '1:00'
    seconds: 60
    title: AI amplifies your practices
    transcript: Research by Google's DORA team looked at how AI software engineering agents affect software
      delivery. Its main finding is that AI amplifies whatever practices a team already has. With a modular,
      API-first architecture and good engineering habits, agents make things better. With tightly coupled
      systems and poor practices, they just produce more problems, faster. So the foundations matter more
      than ever.
  - time: '1:31'
    seconds: 91
    title: Why the ODA helps software engineering agents
    transcript: The ODA gives software engineering agents two things they need. The first is scope. A
      loosely coupled component is a well-bounded task, and agents do much better with focused work. The
      second is context. Open API specifications, component specifications and use cases describe exactly
      what to build. That suits a spec-driven approach. The specification is written and checked first,
      and only then is the code written.
  - time: '2:04'
    seconds: 124
    title: What an Agent Skill is
    transcript: Part four of this series introduced Agent Skills. A skill is a written procedure that
      a software engineering agent follows, step by step. It is a folder with a skill file of instructions.
      It can also hold reference material, templates and scripts for deterministic steps. Agent Skills
      are an open standard, created by Anthropic. They work in Claude Code, GitHub Copilot or another
      software engineering agent. They are not the same as the skills listed in an A2A agent card.
  - time: '2:38'
    seconds: 158
    title: 'Live: a skill that builds ODA Components'
    transcript: It started with one skill, in the reference example components repository. The Canvas
      used to be tested with a single, hand-built product catalog component. The create ODA component
      skill wrote down how an engineer builds a component. An agent following it scaffolded the six other
      reference components in this repository. The same skill now ships in the marketplace as implement
      ODA component.
  - time: '3:13'
    seconds: 193
    title: The procedure, step by step
    transcript: The skill is a precise procedure. It confirms which component to build, from its published
      specification, and asks which optional APIs to include. It then generates the source code, with
      a microservice for each API, plus metrics and role setup. Next it packages everything in a Helm
      chart, verifies the result, and builds the images. Finally, it writes the documentation. An agent
      follows these steps more precisely than a person would. So every improvement to the skill improves
      every component built with it.
  - time: '3:49'
    seconds: 229
    title: 'Live: seven reference components'
    transcript: Here are the results, seven reference components from product catalog to party management.
      Each one is the scaffolding for a functional component. It builds all the interoperability, through
      Open APIs with create, read, update and delete operations. So each has a Helm chart, and source
      code with one folder per microservice. The skill does not attempt to build the business functionality
      inside the component.
  - time: '4:19'
    seconds: 259
    title: 'Live: diagrams generated from the Helm chart'
    transcript: The documentation was generated too. This architecture diagram comes from another skill,
      generate component SVG diagram. It reads the Helm chart, and draws the component with its microservices.
      Dependent APIs are on the left, and exposed APIs on the right, coloured by function. Below it, the
      README describes the core, management and security functions the chart provides.
  - time: '4:48'
    seconds: 288
    title: ODA knowledge as a data product
    transcript: Skills need knowledge they can read efficiently. Many ODA documents are published as PDF
      or Word files, with diagrams as pictures. So the marketplace converts them once into an agent-friendly
      form. Each use case and component becomes a Markdown file, with its links to other assets in a header.
      Sequence diagrams become PlantUML text, and other pictures get a written description. An agent can
      then read a diagram as text, instead of spending tokens interpreting an image.
  - time: '5:23'
    seconds: 323
    title: 'Live: an agent-friendly use case'
    transcript: Here is use case TMFS zero zero one, creating a new party account. The header records
      its version, its maturity, and where it came from. It also lists every component and Open API the
      use case touches. Further down, each sequence diagram links to its PlantUML source. This is the
      text an agent reads, rather than the picture.
  - time: '5:53'
    seconds: 353
    title: An index, not an ontology
    transcript: Skills also need to find things quickly. The first design used a formal ontology to describe
      how the assets relate. In practice, simple JSON index files worked better, and use fewer tokens.
      There is one index each for use cases, components and APIs, with links in both directions. So a
      skill can go straight from an API to every use case that depends on it. As the scope of this work
      grows, a formal ontology may return. For this first version, it was overkill.
  - time: '6:31'
    seconds: 391
    title: Two plugins, one marketplace
    transcript: The marketplace offers two plugins, for two audiences. The consumer plugin is for teams
      building software that uses the ODA. It has nineteen skills. The creator plugin is for the people
      who extend the ODA itself, such as use case and component authors. Each plugin carries its own copy
      of the knowledge, so it works from any project.
  - time: '6:58'
    seconds: 418
    title: 'Live: installing the marketplace'
    transcript: Installing it takes a few prompts. In Claude Code, ask it to add the repository as a plugin
      marketplace. Then list the plugins in the marketplace, and install the one you need. Typing the
      plugin name with a slash lists every skill it provides. You rarely need to name a skill, though.
      Just describe the task, and the agent picks the skill that fits. The same skills work in GitHub
      Copilot or another software engineering agent.
  - time: '7:30'
    seconds: 450
    title: Skills from requirements to operations
    transcript: Software engineering agents can do far more than write code. The consumer skills cover
      the whole software delivery lifecycle. In discovery, they check whether a use case is mature enough,
      and recommend components for a requirement. In design, they turn use cases into user stories, diagrams
      and event designs, and validate a design. In build, they scaffold code and mocks, or implement a
      complete component. In test, they generate BDD scenarios and API conformance tests. And in operation,
      they audit implementations and assess the impact of a change. One more skill runs the whole chain,
      from a requirement to a delivered result.
  - time: '8:15'
    seconds: 495
    title: 'Live: inside a skill'
    transcript: Every skill is just a Markdown file. This one assesses the impact of a change, such as
      deprecating an Open API. Its description tells the agent when to use it. The steps then say exactly
      where to look in the knowledge. The agent identifies the asset, and reads which use cases use it.
      It checks the maturity of each one, then reports the impact in a set format.
  - time: '8:44'
    seconds: 524
    title: Not just code
    transcript: Here are three real requests from a Claude Code session. None of them named a skill. Asked
      which use cases would break if an API were deprecated, the agent chose the change impact skill.
      It produced a table of affected use cases and their risk. Asked for user stories, it chose the requirements
      skill, and wrote stories with acceptance criteria. Asked for conformance tests, it first asked which
      test framework to use. Test-driven development matters even more with agents, because tests give
      them something to verify.
  - time: '9:21'
    seconds: 561
    title: Skills for ODA creators
    transcript: The creator plugin is for the people who build the ODA itself. It drafts new use cases
      in the standard template, and checks drafts before they are submitted. It proposes component or
      API extensions for capability gaps. It also harvests gaps and inconsistencies from published documents,
      and feeds them back to the teams. Even the knowledge base was built with skills, including the ones
      that turned diagram images into PlantUML.
  - time: '9:54'
    seconds: 594
    title: 'Live: built spec-first'
    transcript: The marketplace itself was built the same spec-driven way. The spec describes the intent,
      the scope and the design principles. That is what a person checks. An agent then broke it into a
      plan of tasks, in phases. Each phase was built and verified before the next began, starting with
      six pilot use cases.
  - time: '10:19'
    seconds: 619
    title: An alpha, to show the concept
    transcript: This is an alpha version, released to show the concept. Today, each skill has just one
      worked example. The next step is an evaluation data set for every skill, so each change can be measured
      with a score. The knowledge already includes the Open APIs, components and use case inventory. More
      of the ODA can be added, such as the information, business process, business capability and value
      stream frameworks. The knowledge could also be served through an MCP server, so it is always current.
      The plugins are versioned, so an update refreshes the knowledge on every machine.
  - time: '10:57'
    seconds: 657
    title: Summary and get involved
    transcript: To recap. The ODA gives software engineering agents the scope and the context they need.
      The marketplace packages that knowledge, with skills from requirements through to operations, and
      for ODA creators. The reference example components show the scaffolding the skills can already build.
      The best way to improve the skills is to use them. So try them, and share your feedback through
      the marketplace's GitHub repository.
