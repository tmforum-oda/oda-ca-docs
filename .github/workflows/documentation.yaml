name: Docs

# Builds the documentation site from this repository and the oda-canvas
# repository (see doc/conf.py), and publishes it to the gh-pages branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuild every night so changes to oda-canvas are published without a
  # commit to this repository.
  schedule:
    - cron: "17 3 * * *"
  # Lets the oda-canvas repository trigger a rebuild when its docs change.
  repository_dispatch:
    types: [oda-canvas-docs-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out oda-ca-docs
        uses: actions/checkout@v4
        with:
          path: oda-ca-docs

      - name: Check out oda-canvas
        uses: actions/checkout@v4
        with:
          repository: tmforum-oda/oda-canvas
          path: oda-canvas

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: oda-ca-docs/doc/requirements.txt

      - name: Install dependencies
        working-directory: oda-ca-docs/doc
        run: pip install -r requirements.txt

      - name: Sphinx build
        working-directory: oda-ca-docs/doc
        run: sphinx-build -E -a . _build

      - name: Upload the built site (for previewing pull requests)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: oda-ca-docs/doc/_build/
          retention-days: 14

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: oda-ca-docs/doc/_build/
          force_orphan: true
